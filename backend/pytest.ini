[pytest]
; Suíte de testes de caracterização (Módulo 7a). Ver docs/TESTES.md.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: testes unitários puros, sem banco de dados nem HTTP (sempre rodam)
    integration: testes de integração que exigem o MySQL de teste (variáveis TEST_DB_*) e o app via HTTP
    mudanca_esperada: caracteriza um comportamento atual com correção já planejada neste ciclo (ver docs/TESTES.md, "Mudanças esperadas neste ciclo") — não atualize o teste, a falha pós-merge é o sinal esperado

addopts = -ra --strict-markers

filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20

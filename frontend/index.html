<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Estoque — Revalle</title>
    <!--
      Aplica o tema salvo ANTES da primeira pintura, para quem prefere o modo
      claro não ver um flash de tela escura no recarregamento. Precisa ser
      inline e síncrono (não um <script src> nem type="module", que carregam
      de forma assíncrona/adiada) e rodar aqui, antes da folha de estilo do
      Google Fonts e do script de módulo do app — senão a página já pintou de
      escuro antes de sabermos que o tema é claro. O design é escuro por
      padrão: usa a mesma chave e a mesma semântica de theme.tsx (chave
      'tema'; só fica claro quando o valor salvo for exatamente 'light').
      O useEffect de theme.tsx continua necessário — ele cuida da
      persistência e do estado inicial do React; este script só evita o
      flash visual antes disso.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('tema') !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          // localStorage pode lançar em janela anônima — sem persistência,
          // a página segue no tema escuro (mesmo comportamento de lerTemaSalvo em theme.tsx).
        }
      })()
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

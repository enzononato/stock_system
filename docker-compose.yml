services:

  backend:
    build: ./backend
    container_name: revalle_backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # Monta o storage local quando STORAGE_BACKEND=local
      - backend_storage:/app/storage
      # Templates de documentos Word
      - ./backend/modelos:/app/modelos:ro
    expose:
      - "8000"   # Não publica a porta no host: só acessível pela rede interna do
                 # Docker (o serviço frontend/Nginx faz proxy_pass para backend:8000)
    healthcheck:
      # A imagem python:3.12-slim não inclui curl; usamos urllib da stdlib para
      # não precisar instalar um pacote extra só para o healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: revalle_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # Se usar Caddy/Certbot externamente, pode remover esta linha
    depends_on:
      - backend

volumes:
  backend_storage:
